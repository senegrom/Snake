name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and deterministic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Check whitespace
        # A root commit has no parent, so fall back to diffing against the empty tree
        run: git diff --check "$(git rev-parse --verify --quiet HEAD^ || git hash-object -t tree /dev/null)"

      - name: Compile with all warnings enabled
        shell: bash
        run: |
          mkdir -p out
          mapfile -d '' sources < <(find src test -name '*.java' -print0 | sort -z)
          javac --release 25 -encoding UTF-8 -Xlint:all -Werror -d out "${sources[@]}"

      - name: Run headless regression tests
        run: |
          java -ea -Djava.awt.headless=true -cp out snake.gui.SnakeTests
          java -ea -Djava.awt.headless=true -cp out snake.gui.SnakeSmokeTests
          java -ea -Djava.awt.headless=true -cp out snake.gui.SnakeInteractionTests
          java -ea -Djava.awt.headless=true -cp out snake.gui.SnakeViewportTests render

      - name: Run GUI smoke tests
        run: xvfb-run -a java -ea -Djava.awt.headless=false -cp out snake.gui.SnakeGuiTests

  # The Robot-driven suites depend on real input timing, focus transitions and
  # native window geometry. They run as their own job so that a timing failure
  # is isolated from the deterministic build and can be re-run on its own.
  desktop:
    name: Desktop integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Install window manager for native geometry regressions
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y openbox x11-utils

      - name: Compile
        shell: bash
        run: |
          mkdir -p out
          mapfile -d '' sources < <(find src test -name '*.java' -print0 | sort -z)
          javac --release 25 -encoding UTF-8 -Xlint:all -Werror -d out "${sources[@]}"

      - name: Run real keyboard, focus and timer integration tests
        timeout-minutes: 2
        run: xvfb-run -a -s '-screen 0 1280x1024x24' java -ea -Djava.awt.headless=false -cp out snake.gui.SnakeInputTests

      - name: Run held-key focus-return and control visibility regressions
        timeout-minutes: 2
        run: xvfb-run -a -s '-screen 0 1280x1024x24' java -ea -Djava.awt.headless=false -cp out snake.gui.SnakeFocusLayoutTests

      - name: Run shortcut component-focus regressions
        timeout-minutes: 1
        run: xvfb-run -a -s '-screen 0 1280x1024x24' java -ea -Djava.awt.headless=false -cp out snake.gui.ShortcutTrackerTests

      - name: Run narrow HiDPI layout regressions
        timeout-minutes: 1
        run: >-
          xvfb-run -a -s '-screen 0 1024x768x24'
          java -ea -Djava.awt.headless=false -Dsun.java2d.uiScale=2
          -cp out snake.gui.SnakeFocusLayoutTests small-layout

      - name: Test managed-window resizing, Fit and scrolled restarts
        timeout-minutes: 2
        run: |
          xvfb-run -a -s '-screen 0 1280x1024x24' bash test/run-managed-tests.sh normal
          xvfb-run -a -s '-screen 0 1024x768x24' bash test/run-managed-tests.sh small
